spring.application.name=messaging-app
server.port=8080

# Database - credentials come from environment variables (backend/.env locally)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aionchat_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA - Liquibase owns the schema, Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase - runs pending changesets on startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
